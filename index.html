<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>EDI Gares ONCF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Charte imposée par le cahier des charges : fond blanc, thème clair unique (choix délibéré) */
:root{
  color-scheme:light;
  --white:#FFFFFF; --orange:#F26522; --orange-d:#D9531A; --orange-soft:#FDEBE1;
  --ink:#1A1A1A; --ink-2:#555555; --muted:#7A7A7A;
  --gray:#F5F5F5; --line:#E6E6E6; --line-2:#D6D6D6;
  --red:#E30613; --red-soft:#FDE6E7; --green:#2EA736; --green-soft:#E5F5E6;
  --amber-soft:#FFF1E0;
  --radius:8px; --shadow:0 1px 2px rgba(26,26,26,.05),0 4px 14px rgba(26,26,26,.06);
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--white);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.2;text-wrap:balance}
h1{font-size:24px} h2{font-size:18px;font-weight:600} h3{font-size:15px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- Bandeau & header ---------- */
.band{background:var(--ink);color:#fff;font-size:11.5px;text-align:center;padding:5px 16px;letter-spacing:.02em}
.hdr{background:var(--orange);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.01em;white-space:nowrap}
.logo .mk{width:32px;height:32px;border-radius:7px;background:#fff;display:grid;place-items:center}
.logo small{display:block;font-size:10.5px;font-weight:500;opacity:.9;letter-spacing:.04em}
.hdr .who{font-size:12.5px;line-height:1.25;text-align:right}
.hdr .who b{display:block;font-weight:600}
.hdr select{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:6px 8px;font-weight:600;font-size:13px}
.hdr select option{color:var(--ink)}
.icon-btn{position:relative;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:6px;height:34px;min-width:34px;display:grid;place-items:center;padding:0 8px;font-weight:600;font-size:13px}
.icon-btn:hover{background:rgba(255,255,255,.26)}
.icon-btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
.badge-count{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--orange)}
.pop{position:absolute;right:20px;top:56px;background:#fff;color:var(--ink);width:min(380px,calc(100vw - 32px));border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,.18);border:1px solid var(--line);z-index:40;max-height:70vh;overflow:auto}
.pop-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}

/* ---------- Flux EDI ---------- */
.flow-wrap{border-bottom:1px solid var(--line);background:var(--gray);overflow-x:auto}
.flow{display:flex;align-items:center;gap:0;padding:10px 20px;min-width:max-content}
.step{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted);padding:5px 10px;border-radius:999px;border:1px solid transparent;white-space:nowrap;transition:.25s}
.step i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10.5px;background:#fff;border:1px solid var(--line-2);color:var(--ink-2)}
.step.on{color:var(--ink);background:#fff;border-color:var(--orange)}
.step.on i{background:var(--orange);border-color:var(--orange);color:#fff}
.step.pulse{background:var(--orange);color:#fff;border-color:var(--orange)}
.step.pulse i{background:#fff;color:var(--orange)}
.step.done i{background:var(--green);border-color:var(--green);color:#fff}
.arrow{width:22px;height:2px;background:var(--line-2);position:relative;flex:none}
.arrow::after{content:"";position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left-color:var(--line-2);border-right:0}
.flow-note{font-size:11.5px;color:var(--ink-2);margin-left:14px;white-space:nowrap}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100% - 130px)}
.side{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;background:#fff}
.side .grp{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:6px 10px 8px}
.nav-btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;font-weight:500;color:var(--ink-2);font-size:13.5px}
.nav-btn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav-btn:hover{background:var(--gray);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--orange-soft);color:var(--orange-d);font-weight:600}
.nav-btn:focus-visible{outline:2px solid var(--orange)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:10px}
.side-foot button{all:unset;cursor:pointer;font-size:12px;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}
.main{padding-inline:24px;padding-block:22px 60px;min-width:0;display:flex;flex-direction:column;gap:18px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-h p{color:var(--ink-2);margin-top:4px;max-width:70ch}
.crumb{font-size:12px;color:var(--muted);margin-bottom:4px}
.crumb b{color:var(--orange-d);font-weight:600}

/* ---------- Composants ---------- */
.grid{display:grid;gap:16px}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-wide{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0}
.card.flat{box-shadow:none;background:var(--gray);border-color:transparent}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.kpi .v{font-size:28px;font-weight:700;margin-top:6px;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;font-weight:600;color:var(--ink-2)}
.kpi .d{font-size:12px;color:var(--ink-2);margin-top:6px}
.kpi.alert-k{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.up-bad{color:var(--red);font-weight:600} .up-good{color:var(--green);font-weight:600}

.btn{border:1px solid var(--line-2);background:#fff;border-radius:7px;padding:8px 14px;font-weight:600;font-size:13px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{background:var(--orange-d);border-color:var(--orange-d)}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:var(--orange-d);font-weight:600;font-size:12.5px}
.link:hover{text-decoration:underline}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.pill.crit{background:var(--red);color:#fff}
.pill.high{background:var(--orange-soft);color:var(--orange-d)}
.pill.mid{background:var(--gray);color:var(--ink);border:1px solid var(--line-2)}
.pill.low{background:#fff;color:var(--ink-2);border:1px solid var(--line-2)}
.pill.ok{background:var(--green-soft);color:#1E7A25}
.pill.new{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.pill.prog{background:var(--amber-soft);color:#A04A12}
.pill.miss{background:#fff;color:var(--muted);border:1px dashed var(--muted);text-decoration:line-through}
.pill.edi{background:var(--ink);color:#fff}

.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--orange);color:#fff;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:var(--gray);text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);padding:9px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
table.t th.sort{cursor:pointer;user-select:none}
table.t th.sort:hover{color:var(--ink)}
table.t th .arr{color:var(--orange)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.crit-row td:first-child{box-shadow:inset 3px 0 0 var(--red)}
table.t tr.high-row td:first-child{box-shadow:inset 3px 0 0 var(--orange)}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lab{font-size:12px;font-weight:600;color:var(--ink)}
.field .hint{font-size:11.5px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line-2);border-radius:7px;padding:9px 11px;background:#fff;width:100%;min-width:0}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px var(--orange-soft)}
.field.err input{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:7px;padding:7px 11px;cursor:pointer;font-size:13px;font-weight:500}
.radios input{accent-color:var(--orange);margin:0}
.radios label:has(input:checked){border-color:var(--orange);background:var(--orange-soft)}
.radios label.u-crit:has(input:checked){border-color:var(--red);background:var(--red-soft);color:var(--red)}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.check input{accent-color:var(--orange)}

.banner{border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13.5px}
.banner.warn{background:var(--amber-soft);border:1px solid #F7C9A6}
.banner.crit{background:var(--red-soft);border:1px solid #F5A9AD}
.banner.ok{background:var(--green-soft);border:1px solid #B5E0B8}
.banner b{font-weight:700}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:4px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.li:last-child{border-bottom:0}
.li .bar{align-self:stretch;border-radius:2px;background:var(--line-2)}
.li .bar.crit{background:var(--red)} .li .bar.high{background:var(--orange)} .li .bar.ok{background:var(--green)} .li .bar.miss{background:repeating-linear-gradient(180deg,var(--muted) 0 3px,transparent 3px 6px)}
.li b{font-weight:600;font-size:13.5px}
.li small{display:block;color:var(--ink-2);font-size:12px;margin-top:1px}
.li .meta{font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}

/* EDI */
.edi-steps{display:flex;flex-direction:column;gap:8px}
.edi-step{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:8px 10px;border-radius:7px;background:var(--gray);font-size:13px}
.edi-step .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line-2);font-size:11px;font-weight:700;color:var(--ink-2)}
.edi-step.run .dot{border-color:var(--orange);color:var(--orange);animation:spin 1s linear infinite;border-style:dashed}
.edi-step.pass .dot{background:var(--green);border-color:var(--green);color:#fff}
.edi-step.fail{background:var(--red-soft)}
.edi-step.fail .dot{background:var(--red);border-color:var(--red);color:#fff}
.edi-step small{display:block;color:var(--ink-2);font-size:12px}
.edi-step.fail small{color:var(--red)}
@keyframes spin{to{transform:rotate(360deg)}}
pre.msg{background:var(--ink);color:#F5F5F5;border-radius:7px;padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;overflow:auto;max-height:260px;margin:0;white-space:pre}
pre.msg .k{color:#F9A474}

.chart-box{position:relative;height:240px}
.chart-box.tall{height:280px}
.chart-box.short{height:190px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.dash{background:repeating-linear-gradient(90deg,#8A8A8A 0 4px,transparent 4px 7px)!important}

.rules{display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.rules div{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.decision{border:1px solid var(--orange);background:var(--orange-soft);border-radius:7px;padding:10px;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-top:8px}
.synth{background:var(--gray);border-radius:7px;padding:14px 16px;font-size:13px;white-space:pre-wrap;line-height:1.6}

/* Connexion */
.login{min-height:calc(100% - 28px);display:grid;place-items:center;padding-inline:16px;padding-block:32px;background:linear-gradient(180deg,var(--white) 0,var(--white) 55%,var(--gray) 55%)}
.login-box{width:min(920px,100%);display:flex;flex-direction:column;gap:22px}
.login-top{display:flex;align-items:center;gap:14px}
.login-top .mk{width:52px;height:52px;border-radius:10px;background:var(--orange);display:grid;place-items:center;flex:none}
.login-top h1{font-size:28px}
.login-top p{color:var(--ink-2);margin-top:4px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.role{all:unset;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:.15s}
.role:hover{border-color:var(--orange)}
.role[aria-pressed="true"]{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange)}
.role:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.role .tag{align-self:flex-start;font-weight:700;font-size:12px;letter-spacing:.08em;background:var(--orange);color:#fff;padding:3px 9px;border-radius:5px}
.role h3{font-size:17px}
.role ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.login-form{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;grid-template-columns:1fr 1fr auto;gap:14px;align-items:end;box-shadow:var(--shadow)}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px);display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}

@media (max-width:1180px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){
  .g-wide,.g2{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .roles{grid-template-columns:1fr}
  .login-form{grid-template-columns:1fr}
  .decision{grid-template-columns:1fr}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;right:0;bottom:0;z-index:35;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));gap:0;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
  .side .grp,.side-foot{display:none}
  .nav-btn{flex:1;flex-direction:column;gap:2px;font-size:10px;padding:6px 2px;text-align:center;justify-content:center}
  .nav-btn .long{display:none}
  .main{padding-inline:16px;padding-block:16px 96px}
  .hdr{padding:8px 16px;gap:8px;flex-wrap:wrap}
  .hdr .who{display:none}
  .logo small{display:none}
  .flow{padding:8px 16px}
  .flow-note{display:none}
  .form{grid-template-columns:1fr}
  .g6,.g5,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pop{right:16px}
}
@media (max-width:420px){.g4,.g6,.g5{grid-template-columns:1fr 1fr}.kpi .v{font-size:22px}.hdr select{max-width:130px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="band">Prototype académique · Master MITDO · données entièrement simulées · non affilié à l'ONCF</div>
<div id="app"></div>
<div class="toast" id="toast"><i></i><span></span></div>

<script>
/* =========================================================
   EDI Gares — prototype SIO / SIG / SID
   Tout est simulé côté navigateur : un "store" central joue le rôle
   de la base centrale, et chaque saisie passe par une étape EDI.
   ========================================================= */

// ---------- utilitaires ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const DAY = 864e5, HOUR = 36e5;
const pad = n => String(n).padStart(2, '0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const sod = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const fmtN = n => Math.round(n).toLocaleString('fr-FR');
const fmtP = (x, d = 1) => isFinite(x) ? (x * 100).toFixed(d).replace('.', ',') + ' %' : '—';
const fmtD = s => { const d = typeof s === 'string' ? new Date(s + 'T12:00') : new Date(s); return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }); };
const fmtDT = t => { const d = new Date(t); return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const fmtHM = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const ago = t => { const m = Math.max(0, Math.round((Date.now() - t) / 60000)); if (m < 60) return `il y a ${m} min`; const h = Math.floor(m / 60); if (h < 48) return `il y a ${h} h ${pad(m % 60)}`; return `il y a ${Math.floor(h / 24)} j`; };
const dur = h => h < 24 ? `${h.toFixed(1).replace('.', ',')} h` : `${(h / 24).toFixed(1).replace('.', ',')} j`;

// ---------- génération des données simulées (déterministe) ----------
function seed() {
  const R = mulberry32(20260927), now = Date.now(), TODAY = sod(new Date());
  const reports = [], incidents = [], pannes = [];
  let ni = 1, np = 1;
  const pick = a => a[Math.floor(R() * a.length)];
  const urg = () => { const r = R(); return r < .35 ? 'Faible' : r < .7 ? 'Moyenne' : r < .9 ? 'Haute' : 'Critique'; };
  const resH = u => ({ Faible: [12, 120], Moyenne: [6, 72], Haute: [3, 24], Critique: [.8, 6] }[u]);
  for (let back = 179; back >= 0; back--) {
    const d = new Date(TODAY); d.setDate(d.getDate() - back);
    const key = dk(d), dow = d.getDay(), mon = d.getMonth();
    const dowF = [1.12, .92, .9, .93, .97, 1.18, 1.0][dow];
    const seas = [.9, .88, .95, 1, 1, 1.05, 1.25, 1.3, 1.05, .98, .95, 1.02][mon];
    STATIONS.forEach(s => {
      // aujourd'hui : 3 gares n'ont pas encore transmis (pour la démo)
      const missing = back === 0 ? ['CV', 'OJ', 'MK'].includes(s.id) : R() < .035;
      const trend = 1 + back / 180 * .25; // les retards baissent légèrement sur 6 mois
      let rate = s.ret * trend * (.7 + R() * .6);
      if (s.id === 'FE' && back <= 6) rate = .2 + R() * .06; // anomalie injectée : Fès cette semaine
      if (!missing) {
        const trains = Math.round(s.trains * (.94 + R() * .12));
        const arr = Math.round(trains / 2 + (R() - .5) * 4), dep = trains - arr;
        const ret = Math.min(trains, Math.round(trains * rate));
        const min = ret ? Math.round(ret * (8 + R() * 14)) : 0;
        const voy = Math.round(s.voy * dowF * seas * (.9 + R() * .2));
        const ts = Math.min(now - 5 * 60000, d.getTime() + (19 * 3600 + R() * 3000) * 1000);
        reports.push({ id: `RAP-${s.id}-${key.replace(/-/g, '')}`, gare: s.id, date: key, voy, trains, arr, dep, ret, min, ts, ack: 'ACK-' + Math.floor(R() * 9e5 + 1e5) });
      }
      const mk = (list, kind) => {
        const ts = d.getTime() + (6 + R() * 16) * HOUR; if (ts > now - HOUR) return;
        const u = urg(); const [a, b] = resH(u); const h = a + R() * (b - a);
        const open = ts + h * HOUR > now;
        const base = { gare: s.id, ts, urgence: u, statut: open ? (R() < .5 ? 'Nouveau' : 'En cours') : 'Résolu', resolvedAt: open ? null : ts + h * HOUR };
        if (kind === 'inc') { const type = pick(Object.keys(INC_TYPES)); list.push({ id: `INC-${pad(ni++).padStart(4, '0')}`, type, description: pick(INC_TYPES[type]), ...base }); }
        else { const e = pick(EQUIP); list.push({ id: `MNT-${pad(np++).padStart(4, '0')}`, equipement: e, localisation: pick(LOCS), description: `${e} : ${pick(['arrêt complet', 'fonctionnement intermittent', 'bruit anormal', 'affichage figé', 'défaut électrique'])}`, ...base }); }
      };
      if (R() < s.inc * (s.id === 'FE' && back <= 6 ? 2.5 : 1)) mk(incidents, 'inc');
      if (R() < s.pan) mk(pannes, 'pan');
    });
  }
  // cas récents fixés pour que la démo montre chaque type d'alerte
  incidents.push({ id: `INC-${String(ni++).padStart(4, '0')}`, gare: 'CV', type: 'Sûreté', description: 'Bagage abandonné dans le hall principal, périmètre de sécurité établi', urgence: 'Critique', statut: 'En cours', ts: now - 2.7 * HOUR, resolvedAt: null });
  incidents.push({ id: `INC-${String(ni++).padStart(4, '0')}`, gare: 'FE', type: 'Signalisation', description: 'Défaut du signal d\'entrée voie 2, circulation à vue', urgence: 'Haute', statut: 'En cours', ts: now - 5 * HOUR, resolvedAt: null });
  incidents.push({ id: `INC-${String(ni++).padStart(4, '0')}`, gare: 'CV', type: 'Affluence', description: 'Saturation du quai 3 au départ du train de 18:05', urgence: 'Moyenne', statut: 'Résolu', ts: now - 26 * HOUR, resolvedAt: now - 25 * HOUR });
  pannes.push({ id: `MNT-${String(np++).padStart(4, '0')}`, gare: 'RB', equipement: 'Escalator', localisation: 'Quai 1', description: 'Escalator à l\'arrêt, chaîne de marches bloquée', urgence: 'Critique', statut: 'Nouveau', ts: now - 6 * HOUR, resolvedAt: null });
  pannes.push({ id: `MNT-${String(np++).padStart(4, '0')}`, gare: 'CV', equipement: 'Afficheur voyageurs', localisation: 'Hall principal', description: 'Afficheur des départs figé sur l\'écran 2', urgence: 'Moyenne', statut: 'En cours', ts: now - 22 * HOUR, resolvedAt: null });
  return { v: 3, reports, incidents, pannes, decisions: [], seq: { inc: ni, pan: np, msg: 4200 }, seededAt: now };
}

const todayKey = () => dk(new Date());
const since = days => sod(new Date()).getTime() - (days - 1) * DAY;
const inPer = (ts, days, offset = 0) => { const a = since(days) - offset * days * DAY; return ts >= a && ts < a + days * DAY; };
const repTs = r => new Date(r.date + 'T12:00').getTime();
function agg(gare, days, offset = 0) {
  const g = x => gare === 'all' || x.gare === gare;
  const reps = DB.reports.filter(r => g(r) && inPer(repTs(r), days, offset));
  const inc = DB.incidents.filter(x => g(x) && inPer(x.ts, days, offset));
  const pan = DB.pannes.filter(x => g(x) && inPer(x.ts, days, offset));
  const s = k => reps.reduce((a, r) => a + r[k], 0);
  const nG = gare === 'all' ? STATIONS.length : 1;
  const resolved = [...inc, ...pan].filter(x => x.resolvedAt);
  return {
    voy: s('voy'), trains: s('trains'), ret: s('ret'), min: s('min'), rate: s('ret') / s('trains'),
    inc: inc.length, incCrit: inc.filter(x => x.urgence === 'Critique').length, incOpen: inc.filter(x => x.statut !== 'Résolu').length,
    pan: pan.length, panOpen: pan.filter(x => x.statut !== 'Résolu').length,
    reps: reps.length, expected: nG * days, tx: reps.length / (nG * days),
    delai: resolved.length ? resolved.reduce((a, x) => a + (x.resolvedAt - x.ts) / HOUR, 0) / resolved.length : NaN,
  };
}
const todayReport = g => DB.reports.find(r => r.gare === g && r.date === todayKey());

// ---------- moteur d'alertes & détection d'anomalies ----------
function weeklyAnomaly(gare) {
  // taux de retard des 7 derniers jours comparé aux 24 semaines précédentes (moyenne + 2 écarts-types)
  const rate = off => { const a = agg(gare, 7, off); return a.trains ? a.rate : null; };
  const cur = rate(0); const hist = []; for (let w = 1; w <= 24; w++) { const r = rate(w); if (r != null) hist.push(r); }
  const m = hist.reduce((a, b) => a + b, 0) / hist.length;
  const sd = Math.sqrt(hist.reduce((a, b) => a + (b - m) ** 2, 0) / hist.length);
  return { cur, m, sd, z: (cur - m) / sd, anomaly: cur > m + 2 * sd };
}
function computeAlerts() {
  const out = [], now = Date.now(), h = new Date().getHours();
  DB.incidents.filter(x => x.statut !== 'Résolu' && x.urgence === 'Critique').forEach(x => {
    const late = now - x.ts > 2 * HOUR;
    out.push({ key: 'inc:' + x.id, sev: 'crit', cat: 'Incident critique', gare: x.gare, ts: x.ts, title: late ? `Incident critique non traité depuis plus de 2 h` : 'Incident critique déclaré', detail: `${x.id} · ${x.type} · ${x.description}`, go: 'suivi' });
  });
  DB.pannes.filter(x => x.statut !== 'Résolu' && (x.urgence === 'Critique' || x.urgence === 'Haute')).forEach(x => {
    out.push({ key: 'pan:' + x.id, sev: x.urgence === 'Critique' ? 'crit' : 'high', cat: 'Panne urgente', gare: x.gare, ts: x.ts, title: `Panne ${x.urgence === 'Critique' ? 'urgente' : 'prioritaire'} : ${x.equipement}`, detail: `${x.id} · ${x.localisation} · ${x.description}`, go: 'suivi' });
  });
  STATIONS.forEach(s => {
    if (!todayReport(s.id)) out.push({ key: `rap:${s.id}:${todayKey()}`, sev: h >= 20 ? 'crit' : 'miss', cat: 'Rapport non transmis', gare: s.id, ts: sod(new Date()).getTime() + 20 * HOUR, title: 'Rapport du jour non transmis', detail: h >= 20 ? 'Échéance de 20:00 dépassée' : 'Échéance aujourd\'hui à 20:00', go: 'rapport' });
    const last = DB.reports.filter(r => r.gare === s.id).sort((a, b) => b.ts - a.ts)[0];
    if (last && last.date >= dk(new Date(Date.now() - DAY)) && last.ret / last.trains > .15) out.push({ key: 'ret:' + last.id, sev: 'high', cat: 'Retards importants', gare: s.id, ts: last.ts, title: `Retards importants : ${fmtP(last.ret / last.trains)} des trains`, detail: `Rapport du ${fmtD(last.date)} · ${last.ret} trains en retard · ${fmtN(last.min)} min cumulées`, go: 'dash' });
    const a = weeklyAnomaly(s.id);
    if (a.anomaly) out.push({ key: `ano:${s.id}:${todayKey()}`, sev: 'high', cat: 'Anomalie détectée', gare: s.id, ts: now, title: `Anomalie : taux de retard hebdomadaire anormal`, detail: `7 derniers jours ${fmtP(a.cur)} contre ${fmtP(a.m)} en moyenne (seuil ${fmtP(a.m + 2 * a.sd)}, z = ${a.z.toFixed(1).replace('.', ',')})`, go: 'dash' });
  });
  const rank = { crit: 0, high: 1, miss: 2 };
  out.forEach(a => a.decision = DB.decisions.find(d => d.key === a.key));
  return out.sort((a, b) => rank[a.sev] - rank[b.sev] || b.ts - a.ts);
}

// série temporelle : par jour (7/30 j) ou par semaine (au-delà)
function series(gare, days, fn) {
  const g = x => gare === 'all' || x.gare === gare;
  const step = days > 45 ? 7 : 1, n = Math.ceil(days / step), start = since(days), labels = [], vals = [];
  for (let i = 0; i < n; i++) {
    const a = start + i * step * DAY, b = a + step * DAY;
    const reps = DB.reports.filter(r => g(r) && repTs(r) >= a && repTs(r) < b);
    labels.push(new Date(a).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }));
    vals.push(fn(reps));
  }
  return { labels, vals };
}
const rateOf = reps => { const t = reps.reduce((a, r) => a + r.trains, 0); return t ? reps.reduce((a, r) => a + r.ret, 0) / t : null; };

function buildMsg(r, fmt, ref, gare) {
  const s = ST[gare], d = (r.date || '').replace(/-/g, ''), now = new Date(), stamp = `${String(now.getFullYear()).slice(2)}${pad(now.getMonth() + 1)}${pad(now.getDate())}:${pad(now.getHours())}${pad(now.getMinutes())}`;
  if (fmt === 'json') return JSON.stringify({ entete: { type: 'RAPGAR', version: '1.0', reference: ref, emetteur: `GARE-${s.code}`, destinataire: 'BASE-CENTRALE', horodatage: now.toISOString().slice(0, 19), correctif: !!r.corr }, gare: { code: s.code, nom: s.name }, date: r.date, activite: { voyageurs: +r.voy, trains: +r.trains, arrivees: +r.arr, departs: +r.dep }, ponctualite: { trains_en_retard: +r.ret, minutes_retard: +r.min }, observations: r.obs || null }, null, 2);
  const segs = [`UNB+UNOC:3+GARE-${s.code}+BASE-CENTRALE+${stamp}+${ref}'`, `UNH+${ref}+RAPGAR:1:0:EDIGAR'`, `BGM+RAP+${s.id}-${d}+${r.corr ? '5' : '9'}'`, `DTM+137:${d}:102'`, `LOC+GAR+${s.code}'`, `QTY+VOY:${r.voy}'`, `QTY+TRN:${r.trains}'`, `QTY+ARR:${r.arr}'`, `QTY+DEP:${r.dep}'`, `QTY+RET:${r.ret}'`, `QTY+MRT:${r.min}'`];
  if (r.obs) segs.push(`FTX+AAI+++${r.obs.replace(/['+:?]/g, ' ').slice(0, 70)}'`);

function paintMsg() {

function validateRap(r) {
  const res = [];
  const nums = ['voy', 'trains', 'arr', 'dep', 'ret', 'min'], bad = nums.filter(k => r[k] === '' || !/^\d+$/.test(r[k]));
  const labels = { voy: 'voyageurs', trains: 'trains', arr: 'arrivées', dep: 'départs', ret: 'retards', min: 'minutes' };
  if (!r.date || bad.length || r.date > todayKey()) { res.push({ s: 'fail', msg: !r.date ? 'La date est obligatoire.' : r.date > todayKey() ? 'La date ne peut pas être dans le futur.' : `Valeur manquante ou non entière : ${bad.map(k => labels[k]).join(', ')}.`, fields: bad.map(k => 'r-' + k).concat(!r.date || r.date > todayKey() ? ['r-date'] : []) }); return res; }
  res.push({ s: 'pass', msg: 'Format conforme.' });
  const n = Object.fromEntries(nums.map(k => [k, +r[k]]));
  const errs = [], f = [];
  if (n.arr + n.dep !== n.trains) { errs.push(`arrivées + départs = ${n.arr + n.dep}, différent de ${n.trains} trains`); f.push('r-arr', 'r-dep', 'r-trains'); }
  if (n.ret > n.trains) { errs.push('plus de trains en retard que de trains'); f.push('r-ret'); }
  if (n.ret > 0 && n.min < n.ret * 5) { errs.push(`minutes cumulées trop faibles (minimum ${n.ret * 5} pour ${n.ret} retards de 5 min ou plus)`); f.push('r-min'); }
  if (n.ret === 0 && n.min > 0) { errs.push('des minutes de retard sans train en retard'); f.push('r-min'); }
  if (n.voy > n.trains * 1500) { errs.push('nombre de voyageurs incompatible avec la capacité des trains'); f.push('r-voy'); }
  if (errs.length) { res.push({ s: 'fail', msg: 'Rejeté : ' + errs.join(' ; ') + '.', fields: f }); return res; }
  res.push({ s: 'pass', msg: 'Données cohérentes.' });

  if (dup && !r.corr) { res.push({ s: 'fail', msg: `Un rapport existe déjà pour le ${fmtD(r.date)} (${dup.ack}). Cochez « Rapport correctif » pour le remplacer.`, fields: ['r-date'] }); return res; }
  res.push({ s: 'pass', msg: dup ? 'Correctif accepté : il remplacera le rapport existant.' : 'Aucun doublon.' });
  return res;
}
function bindSioRapport() {

  $('#r-err').onclick = () => { $('#r-ret').value = +$('#r-trains').value + 5; $('#r-min').value = 10; paintMsg(); toast('Valeurs incohérentes insérées : lancez la transmission'); };
  form.onsubmit = async e => {
    e.preventDefault();
    const btn = $('button[type=submit]', form); btn.disabled = true;
    const r = readRap(), checks = validateRap(r), ref = String(DB.seq.msg).padStart(6, '0');
    ediState = { steps: [], ref };
    const flowPulse = i => { $$('#flow .step').forEach(s => s.classList.remove('pulse')); const el = $(`#flow .step[data-i="${i}"]`); if (el) { el.classList.add('pulse'); el.scrollIntoView({ block: 'nearest', inline: 'center' }); } };
    const wait = ms => new Promise(res => setTimeout(res, ms));
    flowPulse(1);
    for (let i = 0; i < 5; i++) {
      ediState.steps[i] = { s: 'run' }; $('#edi-steps').innerHTML = ediStepsHTML(); await wait(420);
      if (i < checks.length) {

        if (checks[i].s === 'fail') { (checks[i].fields || []).forEach(f => $('#' + f)?.closest('.field')?.classList.add('err')); flowPulse(2); await wait(500); $$('#flow .step').forEach(s => s.classList.remove('pulse')); btn.disabled = false; toast('Message rejeté par l\'EDI : corrigez les champs en rouge'); return; }
        if (i === 0) flowPulse(2);

      else {
        const n = k => +r[k], ack = 'ACK-' + Math.floor(Math.random() * 9e5 + 1e5);
        const rep = { id: `RAP-${G()}-${r.date.replace(/-/g, '')}`, gare: G(), date: r.date, voy: n('voy'), trains: n('trains'), arr: n('arr'), dep: n('dep'), ret: n('ret'), min: n('min'), obs: r.obs, ts: Date.now(), ack, ref };
        DB.reports = DB.reports.filter(x => !(x.gare === G() && x.date === r.date)); DB.reports.push(rep); DB.seq.msg++; save();
        ediState.steps[4] = { s: 'pass', msg: `Intégré en base centrale · accusé ${ack} reçu à ${fmtHM(Date.now())}.` };
        for (const k of [4, 5]) { flowPulse(k); await wait(300); }
      }
      $('#edi-steps').innerHTML = ediStepsHTML();
    }
    $$('#flow .step').forEach(s => s.classList.remove('pulse'));
    btn.disabled = false; btn.textContent = 'Transmis ✓';
    toast('Rapport transmis : visible dès maintenant dans le SIG et le SID');
  };
}

// ----- Historique -----
function sioHist() {
  const g = G(), days = UI.histPer, t = UI.histTab;
  let body = '';
  if (t === 'rap') {
    const reps = DB.reports.filter(r => r.gare === g && inPer(repTs(r), days)).sort((a, b) => b.date.localeCompare(a.date));
    const missing = []; for (let i = 0; i < days; i++) { const k = dk(new Date(Date.now() - i * DAY)); if (!reps.some(r => r.date === k)) missing.push(k); }
    body = `${missing.length ? `<div class="banner warn" style="margin-bottom:12px"><span class="pill miss">Non transmis</span><span>${missing.length} jour(s) sans rapport : ${missing.slice(0, 6).map(fmtD).join(', ')}${missing.length > 6 ? '…' : ''}</span></div>` : ''}
    <div class="tbl-wrap"><table class="t"><thead><tr><th>Date</th><th class="r">Voyageurs</th><th class="r">Trains</th><th class="r">Arr. / Dép.</th><th class="r">Retards</th><th class="r">Taux</th><th>Transmission</th></tr></thead><tbody>
    ${reps.map(r => `<tr class="${r.ret / r.trains > .15 ? 'high-row' : ''}"><td>${fmtD(r.date)}</td><td class="r">${fmtN(r.voy)}</td><td class="r">${r.trains}</td><td class="r">${r.arr} / ${r.dep}</td><td class="r">${r.ret}</td><td class="r">${r.ret / r.trains > .15 ? `<span class="pill high">${fmtP(r.ret / r.trains)}</span>` : fmtP(r.ret / r.trains)}</td><td><span class="pill ok">Transmis ${fmtHM(r.ts)}</span> <span class="muted" style="font-size:11px">${r.ack}</span></td></tr>`).join('') || '<tr><td colspan="7" class="empty">Aucun rapport.</td></tr>'}</tbody></table></div>`;
  } else {
    const src = t === 'inc' ? DB.incidents : DB.pannes;
    const rows = src.filter(x => x.gare === g && inPer(x.ts, days)).sort((a, b) => b.ts - a.ts);
    body = `<div class="tbl-wrap"><table class="t"><thead><tr><th>Réf.</th><th>Date</th><th>${t === 'inc' ? 'Type' : 'Équipement'}</th><th>Description</th><th>Urgence</th><th>Statut</th><th class="r">Délai</th></tr></thead><tbody>
    ${rows.map(x => `<tr class="${x.urgence === 'Critique' && x.statut !== 'Résolu' ? 'crit-row' : ''}"><td class="num">${x.id}</td><td class="num">${fmtDT(x.ts)}</td><td>${esc(t === 'inc' ? x.type : x.equipement)}</td><td>${esc(x.description)}</td><td><span class="pill ${URG_CLS[x.urgence]}">${x.urgence}</span></td><td><span class="pill ${STAT_CLS[x.statut]}">${x.statut}</span></td><td class="r">${x.resolvedAt ? dur((x.resolvedAt - x.ts) / HOUR) : '<span class="muted">' + ago(x.ts) + '</span>'}</td></tr>`).join('') || '<tr><td colspan="7" class="empty">Rien sur cette période.</td></tr>'}</tbody></table></div>`;
  }
  return `
  <div class="page-h"><div><div class="crumb">SIO › <b>Historique</b></div><h1>Historique de la gare</h1><p>Tout ce que la gare a transmis à la base centrale.</p></div>
    <div class="seg" id="hper">${[[7, '7 jours'], [30, '30 jours'], [90, '3 mois'], [180, '6 mois']].map(([d, l]) => `<button data-d="${d}" aria-pressed="${days === d}">${l}</button>`).join('')}</div></div>
  <div class="card"><div class="tabs" role="tablist">${[['rap', 'Rapports'], ['inc', 'Incidents'], ['pan', 'Pannes']].map(([k, l]) => `<button role="tab" data-t="${k}" aria-selected="${t === k}">${l}</button>`).join('')}</div>${body}</div>`;
}
function bindSioHist() {
  $$('#hper button').forEach(b => b.onclick = () => { UI.histPer = +b.dataset.d; render(); });
  $$('.tabs button').forEach(b => b.onclick = () => { UI.histTab = b.dataset.t; render(); });
}

const perSeg = (id, cur, opts = [[7, '7 j'], [30, '30 j'], [180, '6 mois']]) => `<div class="seg" id="${id}">${opts.map(([d, l]) => `<button data-d="${d}" aria-pressed="${cur === d}">${l}</button>`).join('')}</div>`;
function gareSel(id, cur) { return `<select id="${id}" class="btn" style="font-weight:600"><option value="all" ${cur === 'all' ? 'selected' : ''}>Toutes les gares</option>${STATIONS.map(s => `<option value="${s.id}" ${cur === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}</select>`; }
function sigDash() {
  const days = UI.period, gsel = UI.gare, A = agg(gsel, days), P = agg(gsel, days, 1);
  const rows = STATIONS.map(s => { const a = agg(s.id, days); return { s, ...a, maint: a.pan, flag: computeAlerts().filter(x => x.gare === s.id && !x.decision) }; });
  const k = UI.sort.k, d = UI.sort.d;
  rows.sort((a, b) => (k === 'name' ? a.s.name.localeCompare(b.s.name) : (a[k] - b[k])) * d);
  const th = (key, lab, r) => `<th class="sort ${r ? 'r' : ''}" data-k="${key}">${lab} ${k === key ? `<span class="arr">${d > 0 ? '▲' : '▼'}</span>` : ''}</th>`;
  const delta = (a, b, inv) => { if (!isFinite(a) || !isFinite(b) || !b) return ''; const x = (a - b) / b; const good = inv ? x < 0 : x > 0; return `<span class="${good ? 'up-good' : 'up-bad'}">${x > 0 ? '+' : ''}${(x * 100).toFixed(0)} %</span> vs période préc.`; };
  return `
  <div class="page-h"><div><div class="crumb">SIG › <b>Performances des gares</b></div><h1>Performances des gares</h1><p>Données consolidées depuis la base centrale à partir des messages EDI des 8 gares.</p></div>
    <div class="row">${gareSel('g-sel', gsel)}${perSeg('per', days)}</div></div>
  <div class="grid g4">
    <div class="card kpi"><div class="label">Voyageurs</div><div class="v">${fmtN(A.voy)}</div><div class="d">${delta(A.voy, P.voy)}</div></div>
    <div class="card kpi"><div class="label">Taux de retard</div><div class="v">${fmtP(A.rate)}</div><div class="d">${delta(A.rate, P.rate, true)}</div></div>
    <div class="card kpi ${A.incCrit && A.incOpen ? '' : ''}"><div class="label">Incidents</div><div class="v">${A.inc} <small>dont ${A.incOpen} ouverts</small></div><div class="d">${A.incCrit ? `<span class="up-bad">${A.incCrit} critique(s)</span>` : 'Aucun critique'}</div></div>
    <div class="card kpi"><div class="label">Demandes de maintenance</div><div class="v">${A.pan} <small>dont ${A.panOpen} ouvertes</small></div><div class="d">Délai moyen de traitement : ${isFinite(A.delai) ? dur(A.delai) : '—'}</div></div>
  </div>
  <div class="card"><div class="card-h"><h2>Comparaison des gares · ${days} derniers jours</h2><span class="muted" style="font-size:12px">Cliquez un en-tête pour trier · une ligne pour filtrer</span></div>
    <div class="tbl-wrap"><table class="t" id="cmp"><thead><tr>${th('name', 'Gare')}${th('voy', 'Voyageurs', 1)}${th('rate', 'Retards', 1)}${th('inc', 'Incidents', 1)}${th('maint', 'Maintenance', 1)}${th('tx', 'Rapports transmis', 1)}<th>Alertes</th></tr></thead><tbody>
    ${rows.map(r => { const crit = r.flag.some(f => f.sev === 'crit'); return `<tr class="${crit ? 'crit-row' : r.flag.length ? 'high-row' : ''}" data-g="${r.s.id}" style="cursor:pointer;${gsel === r.s.id ? 'background:var(--orange-soft)' : ''}"><td><b>${r.s.name}</b></td><td class="r">${fmtN(r.voy)}</td><td class="r">${r.rate > .12 ? `<span class="pill high">${fmtP(r.rate)}</span>` : fmtP(r.rate)}</td><td class="r">${r.inc}${r.incOpen ? ` <span class="muted">(${r.incOpen} ouv.)</span>` : ''}</td><td class="r">${r.pan}${r.panOpen ? ` <span class="muted">(${r.panOpen} ouv.)</span>` : ''}</td><td class="r">${r.tx < .95 ? `<span class="pill miss" style="text-decoration:none">${fmtP(r.tx, 0)}</span>` : fmtP(r.tx, 0)}</td><td>${r.flag.length ? r.flag.slice(0, 2).map(f => SEV_PILL[f.sev]).join(' ') + (r.flag.length > 2 ? ` <span class="muted">+${r.flag.length - 2}</span>` : '') : '<span class="pill ok">OK</span>'}</td></tr>`; }).join('')}</tbody></table></div></div>
  <div class="grid g2">
    <div class="card"><div class="card-h"><h2>Évolution du taux de retard</h2><div class="legend"><span><i style="background:${C.orange}"></i>${gsel === 'all' ? 'Toutes les gares' : ST[gsel].name}</span>${gsel !== 'all' ? '<span><i class="dash"></i>Moyenne réseau</span>' : ''}</div></div><div class="chart-box"><canvas id="c-sig-ret" aria-label="Évolution du taux de retard"></canvas></div></div>
    <div class="card"><div class="card-h"><h2>Incidents par gare</h2><span class="muted" style="font-size:12px">${days} derniers jours</span></div><div class="chart-box"><canvas id="c-sig-inc" aria-label="Incidents par gare"></canvas></div></div>
  </div>`;
}
function bindSigDash() {
  $('#g-sel').onchange = e => { UI.gare = e.target.value; render(); };
  $$('#per button').forEach(b => b.onclick = () => { UI.period = +b.dataset.d; render(); });
  $$('#cmp th.sort').forEach(th => th.onclick = () => { const k = th.dataset.k; UI.sort = { k, d: UI.sort.k === k ? -UI.sort.d : -1 }; render(); });

  const days = UI.period, a = series(UI.gare, days, rateOf), ds = [lineDS(a.vals, C.orange, { fill: true, label: UI.gare === 'all' ? 'Toutes les gares' : ST[UI.gare].name, spanGaps: true })];

  mkChart('c-sig-ret', { type: 'line', data: { labels: a.labels, datasets: ds }, options: { scales: { y: { ticks: pctTick } }, plugins: { tooltip: { callbacks: { label: c => ` ${c.dataset.label} : ${fmtP(c.parsed.y)}` } } } } });
  const inc = STATIONS.map(s => DB.incidents.filter(x => x.gare === s.id && inPer(x.ts, days)));
  mkChart('c-sig-inc', { type: 'bar', data: { labels: STATIONS.map(s => s.name), datasets: [barDS(inc.map(l => l.length), STATIONS.map(s => UI.gare === 'all' || UI.gare === s.id ? C.orange : '#F8B894'), { label: 'Incidents' })] }, options: { interaction: { mode: 'nearest', intersect: true }, scales: { x: { ticks: { autoSkip: false, maxRotation: 45, minRotation: 0 } }, y: { ticks: { precision: 0 } } }, plugins: { tooltip: { callbacks: { label: c => ` ${c.parsed.y} incident(s) · dont ${inc[c.dataIndex].filter(x => x.urgence === 'Critique').length} critique(s)` } } } } });
}

  </div>`;
}
function bindSigSuivi() {
  const map = { 'f-kind': 'kind', 'f-gare': 'gare', 'f-stat': 'statut', 'f-urg': 'urg' };
  Object.entries(map).forEach(([id, k]) => $('#' + id).onchange = e => { UI.suivi[k] = e.target.value; render(); });
  $$('[data-act]').forEach(b => b.onclick = () => {
    const id = b.dataset.id, x = [...DB.incidents, ...DB.pannes].find(y => y.id === id);
    if (b.dataset.act === 'take') { x.statut = 'En cours'; toast(`${id} pris en charge`); }
    else { x.statut = 'Résolu'; x.resolvedAt = Date.now(); toast(`${id} clôturé en ${dur((x.resolvedAt - x.ts) / HOUR)}`); }

// ----- Rapports périodiques -----
let rpt = { gare: 'all', from: null, to: null };
function sigRapports() {
  if (!rpt.from) { rpt.to = todayKey(); rpt.from = dk(new Date(Date.now() - 29 * DAY)); }
  const a = new Date(rpt.from + 'T00:00').getTime(), b = new Date(rpt.to + 'T23:59').getTime();
  const days = Math.max(1, Math.round((b - a) / DAY));
  const g = x => rpt.gare === 'all' || x.gare === rpt.gare;
  const reps = DB.reports.filter(r => g(r) && r.date >= rpt.from && r.date <= rpt.to);
  const inc = DB.incidents.filter(x => g(x) && x.ts >= a && x.ts <= b), pan = DB.pannes.filter(x => g(x) && x.ts >= a && x.ts <= b);
  const sum = k => reps.reduce((s, r) => s + r[k], 0), nG = rpt.gare === 'all' ? 8 : 1;
  const res = [...inc, ...pan].filter(x => x.resolvedAt), del = res.length ? res.reduce((s, x) => s + (x.resolvedAt - x.ts) / HOUR, 0) / res.length : NaN;
  const net = DB.reports.filter(r => r.date >= rpt.from && r.date <= rpt.to), netRate = net.reduce((s, r) => s + r.ret, 0) / net.reduce((s, r) => s + r.trains, 0);
  const byType = {}; inc.forEach(x => byType[x.type] = (byType[x.type] || 0) + 1);
  const topType = Object.entries(byType).sort((x, y) => y[1] - x[1])[0];
  const perG = STATIONS.map(s => { const rr = DB.reports.filter(r => r.gare === s.id && r.date >= rpt.from && r.date <= rpt.to); const t = rr.reduce((q, r) => q + r.trains, 0); return { s, rate: t ? rr.reduce((q, r) => q + r.ret, 0) / t : 0, tx: rr.length / days }; });
  const worst = [...perG].sort((x, y) => y.rate - x.rate)[0];
  const name = rpt.gare === 'all' ? 'Réseau (8 gares)' : ST[rpt.gare].name;
  const rate = sum('ret') / sum('trains');
  const txt = `SYNTHÈSE PÉRIODIQUE · ${name}
Période : du ${fmtD(rpt.from)} au ${fmtD(rpt.to)} (${days} jours)

Activité
• Voyageurs : ${fmtN(sum('voy'))}
• Trains : ${fmtN(sum('trains'))} (${fmtN(sum('arr'))} arrivées, ${fmtN(sum('dep'))} départs)

Ponctualité
• Taux de retard : ${fmtP(rate)}${rpt.gare !== 'all' ? ` (moyenne réseau ${fmtP(netRate)})` : ''}
• Minutes de retard cumulées : ${fmtN(sum('min'))}

Incidents et maintenance
• Incidents : ${inc.length}, dont ${inc.filter(x => x.urgence === 'Critique').length} critique(s), ${inc.filter(x => x.statut === 'Résolu').length} résolu(s)
• Demandes de maintenance : ${pan.length}, dont ${pan.filter(x => x.statut === 'Résolu').length} résolue(s)
• Délai moyen de traitement : ${isFinite(del) ? dur(del) : 'n/d'}
${topType ? `• Type d'incident le plus fréquent : ${topType[0]} (${topType[1]})` : ''}

Qualité de la remontée EDI
• Rapports transmis : ${reps.length} / ${nG * days} (${fmtP(reps.length / (nG * days), 0)})

Points d'attention
${rpt.gare === 'all' ? `• Gare la moins ponctuelle : ${worst.s.name} (${fmtP(worst.rate)})` : rate > netRate ? `• Taux de retard supérieur de ${((rate - netRate) * 100).toFixed(1).replace('.', ',')} pt à la moyenne réseau` : '• Ponctualité meilleure que la moyenne réseau'}
${[...inc, ...pan].filter(x => x.statut !== 'Résolu').length ? `• ${[...inc, ...pan].filter(x => x.statut !== 'Résolu').length} dossier(s) encore ouvert(s) en fin de période` : '• Aucun dossier ouvert en fin de période'}`;
  return `
  <div class="page-h"><div><div class="crumb">SIG › <b>Rapports périodiques</b></div><h1>Rapports périodiques</h1><p>Choisissez une gare et une période : la synthèse se calcule à partir de la base centrale.</p></div></div>
  <div class="card"><div class="row" style="gap:14px;align-items:flex-end">
    <div class="field"><label for="rp-g">Gare</label>${gareSel('rp-g', rpt.gare)}</div>
    <div class="field"><label for="rp-from">Du</label><input type="date" id="rp-from" value="${rpt.from}" max="${todayKey()}"></div>
    <div class="field"><label for="rp-to">Au</label><input type="date" id="rp-to" value="${rpt.to}" max="${todayKey()}"></div>
    <div class="seg" id="rp-quick"><button data-q="7">Semaine</button><button data-q="30">Mois</button><button data-q="90">Trimestre</button></div>
  </div></div>
  <div class="grid g-wide">
    <div class="card"><div class="card-h"><h2>Synthèse</h2><button class="btn primary sm" id="rp-copy">Copier la synthèse</button></div><div class="synth" id="rp-txt">${esc(txt)}</div></div>
    <div class="card"><div class="card-h"><h2>Détail par gare</h2></div><div class="tbl-wrap"><table class="t"><thead><tr><th>Gare</th><th class="r">Retards</th><th class="r">Rapports</th></tr></thead><tbody>
    ${perG.map(p => `<tr style="${rpt.gare === p.s.id ? 'background:var(--orange-soft)' : ''}"><td>${p.s.name}</td><td class="r">${p.rate > .12 ? `<span class="pill high">${fmtP(p.rate)}</span>` : fmtP(p.rate)}</td><td class="r">${fmtP(Math.min(1, p.tx), 0)}</td></tr>`).join('')}</tbody></table></div></div>
  </div>`;
}
function bindSigRapports() {
  $('#rp-g').onchange = e => { rpt.gare = e.target.value; render(); };
  $('#rp-from').onchange = e => { rpt.from = e.target.value; if (rpt.from > rpt.to) rpt.to = rpt.from; render(); };
  $('#rp-to').onchange = e => { rpt.to = e.target.value; if (rpt.to < rpt.from) rpt.from = rpt.to; render(); };
  $$('#rp-quick button').forEach(b => b.onclick = () => { rpt.to = todayKey(); rpt.from = dk(new Date(Date.now() - (+b.dataset.q - 1) * DAY)); render(); });
  $('#rp-copy').onclick = () => { const t = $('#rp-txt').textContent; navigator.clipboard?.writeText(t).then(() => toast('Synthèse copiée'), () => selectTxt()); if (!navigator.clipboard) selectTxt(); };
  function selectTxt() { const r = document.createRange(); r.selectNodeContents($('#rp-txt')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texte sélectionné : faites Ctrl+C'); }
}

// =========================================================
//  NIVEAU 3 — SID
// =========================================================
function sidDash() {
  const days = UI.sidPer, A = agg('all', days), P = agg('all', days, 1), al = computeAlerts().filter(a => !a.decision);
  const trend = (a, b, inv, fmt) => { if (!isFinite(a) || !isFinite(b) || !b) return '<span class="muted">—</span>'; const x = (a - b) / b; const good = inv ? x <= 0 : x >= 0; return `<span class="${good ? 'up-good' : 'up-bad'}">${x > 0 ? '▲' : '▼'} ${Math.abs(x * 100).toFixed(0)} %</span> vs période préc.`; };
  return `
  <div class="page-h"><div><div class="crumb">SID › <b>Tableau décisionnel</b></div><h1>Vision stratégique du réseau</h1><p>Indicateurs consolidés des 8 gares, alimentés en continu par les flux EDI.</p></div>${perSeg('sper', days, [[30, '30 jours'], [90, '3 mois'], [180, '6 mois']])}</div>
  ${al.some(a => a.sev === 'crit') ? `<div class="banner crit"><span class="pill crit">${al.filter(a => a.sev === 'crit').length} critique(s)</span><span><b>${esc(al.find(a => a.sev === 'crit').title)}</b> · ${ST[al.find(a => a.sev === 'crit').gare].name}</span><span class="spacer"></span><button class="btn primary sm" data-go="alertes">Ouvrir le centre d'alertes</button></div>` : ''}
  <div class="grid g6">
    <div class="card kpi"><div class="label">Taux de retard</div><div class="v">${fmtP(A.rate)}</div><div class="d">${trend(A.rate, P.rate, true)}</div></div>
    <div class="card kpi ${A.incCrit ? '' : ''}"><div class="label">Incidents · critiques</div><div class="v">${A.inc} <small>· <span style="color:var(--red)">${A.incCrit}</span></small></div><div class="d">${trend(A.inc, P.inc, true)}</div></div>
    <div class="card kpi"><div class="label">Voyageurs</div><div class="v">${A.voy > 1e6 ? (A.voy / 1e6).toFixed(2).replace('.', ',') + ' <small>M</small>' : fmtN(A.voy)}</div><div class="d">${trend(A.voy, P.voy)}</div></div>
    <div class="card kpi ${A.tx < .95 ? 'alert-k' : ''}"><div class="label">Rapports transmis</div><div class="v">${fmtP(A.tx, 1)}</div><div class="d">${A.reps} / ${A.expected} attendus</div></div>
    <div class="card kpi"><div class="label">Pannes</div><div class="v">${A.pan}</div><div class="d">${trend(A.pan, P.pan, true)}</div></div>
    <div class="card kpi"><div class="label">Délai moyen de traitement</div><div class="v">${isFinite(A.delai) ? dur(A.delai) : '—'}</div><div class="d">${trend(A.delai, P.delai, true)}</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><div class="card-h"><h2>Évolution mensuelle du taux de retard</h2><span class="muted" style="font-size:12px">6 derniers mois</span></div><div class="chart-box"><canvas id="c-sid-m" aria-label="Taux de retard mensuel"></canvas></div></div>
    <div class="card"><div class="card-h"><h2>Incidents et pannes par mois</h2><div class="legend"><span><i style="background:${C.orange};height:10px;width:10px"></i>Incidents</span><span><i style="background:#1A1A1A;height:10px;width:10px"></i>Pannes</span></div></div><div class="chart-box"><canvas id="c-sid-ip" aria-label="Incidents et pannes par mois"></canvas></div></div>
  </div>
  <div class="grid g2">
    <div class="card"><div class="card-h"><h2>Comparaison des gares · taux de retard</h2><div class="legend"><span><i class="dash"></i>Moyenne réseau ${fmtP(A.rate)}</span></div></div><div class="chart-box"><canvas id="c-sid-g" aria-label="Comparaison des gares"></canvas></div></div>
    <div class="card"><div class="card-h"><h2>Répartition des problèmes</h2><span class="muted" style="font-size:12px">${days} derniers jours</span></div><div class="chart-box"><canvas id="c-sid-t" aria-label="Répartition des problèmes par type"></canvas></div></div>
  </div>
  <div class="card"><div class="card-h"><h2>Dernières alertes</h2><button class="link" data-go="alertes">Tout voir et décider</button></div>${al.length ? `<div class="list">${al.slice(0, 4).map(a => alertLi(a)).join('')}</div>` : '<p class="empty">Aucune alerte active.</p>'}</div>`;
}
function monthly() {
  const out = []; const n = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(n.getFullYear(), n.getMonth() - i, 1), key = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
    const reps = DB.reports.filter(r => r.date.startsWith(key));
    const inM = x => { const t = new Date(x.ts); return t.getFullYear() === d.getFullYear() && t.getMonth() === d.getMonth(); };
    out.push({ label: d.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '') + (i === 0 ? ' (en cours)' : ''), rate: rateOf(reps), inc: DB.incidents.filter(inM).length, pan: DB.pannes.filter(inM).length });
  }
  return out;
}
function bindSidDash() {
  $$('#sper button').forEach(b => b.onclick = () => { UI.sidPer = +b.dataset.d; render(); });
  const m = monthly();
  mkChart('c-sid-m', { type: 'line', data: { labels: m.map(x => x.label), datasets: [lineDS(m.map(x => x.rate), C.orange, { fill: true, pointRadius: 4, label: 'Taux de retard' })] }, options: { scales: { y: { ticks: pctTick } }, plugins: { tooltip: { callbacks: { label: c => ` Taux de retard : ${fmtP(c.parsed.y)}` } } } } });
  mkChart('c-sid-ip', { type: 'bar', data: { labels: m.map(x => x.label), datasets: [barDS(m.map(x => x.inc), C.orange, { label: 'Incidents' }), barDS(m.map(x => x.pan), '#1A1A1A', { label: 'Pannes' })] }, options: { datasets: { bar: { categoryPercentage: .7, barPercentage: .9 } }, scales: { y: { ticks: { precision: 0 } } } } });
  const days = UI.sidPer, A = agg('all', days), rows = STATIONS.map(s => ({ s, r: agg(s.id, days).rate })).sort((a, b) => b.r - a.r);
  mkChart('c-sid-g', { type: 'bar', data: { labels: rows.map(x => x.s.name), datasets: [barDS(rows.map(x => x.r), rows.map(x => x.r > A.rate ? C.orange : '#F8B894'), { label: 'Taux de retard', order: 2 }), { type: 'line', data: rows.map(() => A.rate), borderColor: C.gray, borderDash: [4, 3], borderWidth: 1.5, pointRadius: 0, label: 'Moyenne réseau', order: 1 }] }, options: { indexAxis: 'y', interaction: { mode: 'nearest', axis: 'y', intersect: false }, scales: { x: { beginAtZero: true, grid: { color: C.grid, display: true }, ticks: pctTick }, y: { grid: { display: false } } }, plugins: { tooltip: { callbacks: { label: c => ` ${c.dataset.label} : ${fmtP(c.parsed.x)}` } } } } });
  const cnt = {}; DB.incidents.filter(x => inPer(x.ts, days)).forEach(x => cnt[x.type] = (cnt[x.type] || 0) + 1);
  cnt['Pannes d\'équipement'] = DB.pannes.filter(x => inPer(x.ts, days)).length;
  const late = DB.reports.filter(r => inPer(repTs(r), days) && r.ret / r.trains > .15).length; cnt['Journées à retards importants'] = late;
  const t = Object.entries(cnt).sort((a, b) => b[1] - a[1]);
  mkChart('c-sid-t', { type: 'bar', data: { labels: t.map(x => x[0]), datasets: [barDS(t.map(x => x[1]), C.orange, { label: 'Occurrences' })] }, options: { indexAxis: 'y', interaction: { mode: 'nearest', axis: 'y', intersect: false }, scales: { x: { grid: { color: C.grid, display: true }, ticks: { precision: 0 } }, y: { grid: { display: false } } } } });
}

// ----- Centre d'alertes -----
const DECISIONS = ['Renfort de personnel en gare', 'Maintenance prioritaire', 'Audit de la gare', 'Rappel à l\'ordre (transmission EDI)', 'Ajustement du plan de transport', 'Classer sans suite'];
let decOpen = null;
function sidAlertes() {
  const all = computeAlerts(), F = UI.alertF;
  const list = all.filter(a => F === 'all' ? true : F === 'open' ? !a.decision : F === 'done' ? !!a.decision : a.sev === F);
  const cnt = s => all.filter(a => a.sev === s && !a.decision).length;
  return `
  <div class="page-h"><div><div class="crumb">SID › <b>Centre d'alertes</b></div><h1>Centre d'alertes et détection d'anomalies</h1><p>Les règles tournent en continu sur la base centrale. Chaque alerte peut donner lieu à une décision, dernière étape du flux EDI.</p></div></div>
  <div class="grid g4">
    <div class="card kpi ${cnt('crit') ? 'alert-k' : ''}"><div class="label">Critiques</div><div class="v" style="color:var(--red)">${cnt('crit')}</div></div>
    <div class="card kpi"><div class="label">Importantes</div><div class="v" style="color:var(--orange-d)">${cnt('high')}</div></div>
    <div class="card kpi"><div class="label">Rapports non transmis</div><div class="v">${all.filter(a => a.cat === 'Rapport non transmis').length}</div></div>
    <div class="card kpi"><div class="label">Décisions prises</div><div class="v" style="color:var(--green)">${DB.decisions.length}</div></div>
  </div>
  <div class="grid g-wide">
    <div class="card">
      <div class="card-h"><div class="seg" id="af">${[['open', 'À traiter'], ['crit', 'Critiques'], ['high', 'Importantes'], ['done', 'Traitées'], ['all', 'Toutes']].map(([k, l]) => `<button data-f="${k}" aria-pressed="${F === k}">${l}</button>`).join('')}</div><span class="muted" style="font-size:12px">${list.length} alerte(s)</span></div>
      ${list.length ? `<div class="list">${list.map(a => `<div class="li"><span class="bar ${a.decision ? 'ok' : a.sev === 'crit' ? 'crit' : a.sev === 'high' ? 'high' : 'miss'}"></span>
        <div><div class="row" style="gap:6px">${a.decision ? '<span class="pill ok">Décision prise</span>' : SEV_PILL[a.sev]}<span class="label">${a.cat} · ${ST[a.gare].name}</span></div>
          <b style="display:block;margin-top:4px">${esc(a.title)}</b><small>${esc(a.detail)}</small>
          ${a.decision ? `<small style="margin-top:4px;color:#1E7A25"><b>${esc(a.decision.type)}</b>${a.decision.note ? ' · ' + esc(a.decision.note) : ''} · ${fmtDT(a.decision.ts)}</small>` : decOpen === a.key ? `<form class="decision" data-key="${a.key}"><div class="field"><label for="d-type">Décision</label><select id="d-type">${DECISIONS.map(d => `<option>${d}</option>`).join('')}</select></div><div class="field"><label for="d-note">Commentaire</label><input id="d-note" placeholder="Ex. : 2 agents supplémentaires ce week-end"></div><div class="row"><button class="btn primary sm" type="submit">Enregistrer</button><button class="btn sm" type="button" data-cancel>Annuler</button></div></form>` : ''}
        </div>
        <div class="meta">${a.cat === 'Rapport non transmis' ? 'échéance 20:00' : ago(a.ts)}${!a.decision && decOpen !== a.key ? `<br><button class="btn sm primary" style="margin-top:6px" data-dec="${a.key}">Prendre une décision</button>` : ''}</div></div>`).join('')}</div>` : '<p class="empty">Aucune alerte dans cette catégorie.</p>'}
    </div>
    <div class="grid" style="align-content:start">
      <div class="card"><div class="card-h"><h2>Règles de détection</h2></div><div class="rules">
        <div><span class="pill crit">Critique</span><span>Incident critique ouvert, et « non traité » au-delà de 2 h</span></div>
        <div><span class="pill crit">Critique</span><span>Panne urgente d'un équipement de sécurité ou d'accessibilité</span></div>
        <div><span class="pill high">Important</span><span>Retards importants : plus de 15 % des trains dans le dernier rapport</span></div>
        <div><span class="pill high">Important</span><span>Anomalie : taux de retard des 7 derniers jours supérieur à la moyenne des 24 semaines précédentes + 2 écarts-types</span></div>
        <div><span class="pill miss">Non transmis</span><span>Rapport du jour absent (devient critique après 20:00)</span></div>
      </div></div>
      <div class="card"><div class="card-h"><h2>Anomalies · score z par gare</h2></div><div class="tbl-wrap"><table class="t"><thead><tr><th>Gare</th><th class="r">7 j</th><th class="r">Moyenne</th><th class="r">z</th></tr></thead><tbody>
        ${STATIONS.map(s => ({ s, a: weeklyAnomaly(s.id) })).sort((x, y) => y.a.z - x.a.z).map(({ s, a }) => `<tr class="${a.anomaly ? 'high-row' : ''}"><td>${s.name}</td><td class="r">${fmtP(a.cur)}</td><td class="r">${fmtP(a.m)}</td><td class="r">${a.anomaly ? `<span class="pill high">${a.z.toFixed(1).replace('.', ',')}</span>` : a.z.toFixed(1).replace('.', ',')}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="card"><div class="card-h"><h2>Journal des décisions</h2></div>${DB.decisions.length ? `<div class="list">${[...DB.decisions].reverse().slice(0, 6).map(d => `<div class="li"><span class="bar ok"></span><div><b>${esc(d.type)}</b><small>${ST[d.gare].name} · ${esc(d.title)}${d.note ? ' · ' + esc(d.note) : ''}</small></div><div class="meta">${fmtDT(d.ts)}</div></div>`).join('')}</div>` : '<p class="empty">Aucune décision enregistrée.</p>'}</div>
    </div>
  </div>`;
}
function bindSidAlertes() {
  $$('#af button').forEach(b => b.onclick = () => { UI.alertF = b.dataset.f; decOpen = null; render(); });
  $$('[data-dec]').forEach(b => b.onclick = () => { decOpen = b.dataset.dec; render(); $('#d-type')?.focus(); });
  $$('[data-cancel]').forEach(b => b.onclick = () => { decOpen = null; render(); });
  $$('form.decision').forEach(f => f.onsubmit = e => {

}

// ---------- tables de routage ----------
const VIEWS = { SIO: { dash: sioDash, rapport: sioRapport, incident: sioIncident, panne: sioPanne, historique: sioHist }, SIG: { dash: sigDash, suivi: sigSuivi, rapports: sigRapports }, SID: { dash: sidDash, alertes: sidAlertes } };

if (window.Chart) { Chart.defaults.font.family = 'Montserrat, system-ui, sans-serif'; Chart.defaults.color = '#555555'; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.pop) { UI.pop = false; render(); } });
render();
</script>
